name: mytick
description: "MyTickets — Every Experience. One Ticket."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  modal_bottom_sheet: ^3.0.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  intl: ^0.19.0
  uuid: ^4.4.0
  smooth_page_indicator: ^1.1.0
  pinput: ^5.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  percent_indicator: ^4.2.3
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0

  # Payment
  razorpay_flutter: ^1.3.7

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style_dark.json
    - assets/images/
